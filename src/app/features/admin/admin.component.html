<main class="contenedor seccion">
    <h1>Administrador de Bienes Raices</h1>

    <a [routerLink]="['crear']" class="boton boton-verde">Nueva propiedad</a>

    <table class="propiedades">
        <thead>
            <tr>
                <th>ID</th>
                <th>Título</th>
                <th>Imagen</th>
                <th>Precio</th>
                <th>Acciones</th>
            </tr>
        </thead>
        
        <tbody *ngFor="let dato of datos">
            <tr>
                <td >1</td>
                <td>{{dato.titulo}}</td>
                <td>
                 <!-- <img *ngIf="dato.imagen && dato.imagen.url; else noImagen" [src]="'http://localhost:3000/api/v1/files/propiedad/' + dato.imagen.url" [alt]="'imagen ' + dato.titulo" class="imagen-tabla"> -->
                 <img *ngIf="dato.imagen && dato.imagen.url; else noImagen" [src]= "url + dato.imagen.url" [alt]="'imagen ' + dato.titulo" class="imagen-tabla">
            <ng-template #noImagen>
                <img src="./assets/img/no-hay-foto.jpg" alt="Imagen no disponible" class="imagen-tabla">
            </ng-template>

                </td>
                <td>{{dato.precio}}</td>
                <td>
                    <!-- <form (ngSubmit)="eliminarProp($event, dato.id)" class="w-100">
                        <input type="submit" value="Eliminar" class="boton boton-rojo">
                    </form> -->
                    <button class="boton boton-rojo">Eliminar</button>
                    <a [routerLink]="['actualizar', dato.id]" class="boton boton-celeste">Editar</a>
                </td>
            </tr>
        </tbody>
    </table>
</main>
