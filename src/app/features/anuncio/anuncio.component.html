<main class="contenedor seccion contenido-centrado">
    <h1>{{propiedad?.titulo}}</h1>    

    <picture>
        <img *ngIf="propiedad?.imagen?.length; else noImagen" 
             [src]="url + (propiedad?.imagen?.[0] || '')" 
             [alt]="'imagen de ' + propiedad?.titulo"
             loading="lazy">
        <ng-template #noImagen>
            <img 
            src="../../../assets/img/no-hay-foto.jpg" 
            alt="Imagen no disponible"
            loading="lazy">
        </ng-template>
    </picture>

    <div class="resumen-propiedad">
        <p class="precio">${{propiedad?.precio}}</p>
        <ul class="iconos-caracteristicas">
            <li>
                <img class="icono" loading="lazy" src="../../assets/img/icono_wc.svg" alt="icono wc">
                <p>{{propiedad?.banio}}</p>
            </li>
            <li>
                <img class="icono" loading="lazy" src="../../assets/img/icono_estacionamiento.svg" alt="icono estacionamiento">
                <p>{{propiedad?.estacionamiento}}</p>
            </li>
            <li>
                <img class="icono"  loading="lazy" src="../../assets/img/icono_dormitorio.svg" alt="icono habitaciones">
                <p>{{propiedad?.habitaciones}}</p>
            </li>
        </ul>

        <p>{{propiedad?.descripcion}}</p>
    </div>
</main>
