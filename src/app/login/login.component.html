<div class="login-container">
  <h2>Login</h2>

  <form
    autocomplete="off"
    [formGroup]="myForm"
    (ngSubmit)="login()">
   
    <div class="form-group">
      <label for="email">Email:</label>
      <input 
      type="email" 
      id="email" 
      name="email" 
      formControlName="email">
      
      <div class="error" *ngIf="myForm.get('password')?.touched && myForm.get('password')?.invalid">
        <span *ngIf="myForm.get('email')?.errors?.['required']">El email es obligatorio.</span>
        <span *ngIf="myForm.get('email')?.errors?.['email']">Ingrese un email válido.</span>
      </div>
      
    </div>

    <div class="form-group">
      <label for="password">Contraseña:</label>
      <input 
      type="text" 
      id="password" 
      name="password"
      formControlName="password">
      <span class="focus-input100"></span>
      
      <div class="error" *ngIf="myForm.get('password')?.touched && myForm.get('password')?.invalid">
        <span *ngIf="myForm.get('password')?.errors?.['required']">La contraseña es obligatoria.</span>
        <span *ngIf="myForm.get('password')?.errors?.['minlength']">
          La contraseña debe tener al menos 6 caracteres.
        </span>
      </div>

    </div>

    <button 
    type="submit" [disabled]="myForm.invalid" 
    [class.disabled]="myForm.invalid"
    >Iniciar
  </button>
     
  </form>
